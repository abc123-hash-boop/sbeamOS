set default=0
set timeout=5

if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=auto
    insmod gfxterm
    terminal_output gfxterm
fi

insmod part_gpt
insmod part_msdos
insmod iso9660
insmod search_label
insmod linux

search --no-floppy --label --set=root SBEAMOS

menuentry 'SbeamOS Live' {
    linux /boot/vmlinuz \
        root=live:CDLABEL=SBEAMOS \
        rd.live.dir=LiveOS \
        rd.live.squashimg=rootfs.squashfs \
        rd.sbeamos.live=1 \
        quiet splash
    initrd /boot/sbeamos-live-initrd.img
}

menuentry 'SbeamOS Live (safe graphics)' {
    linux /boot/vmlinuz \
        root=live:CDLABEL=SBEAMOS \
        rd.live.dir=LiveOS \
        rd.live.squashimg=rootfs.squashfs \
        rd.sbeamos.live=1 \
        nomodeset
    initrd /boot/sbeamos-live-initrd.img
}
